<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Mandamentos para a Política Brasileira</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --gold: #d4a853;
            --gold-bg: rgba(212,168,83,0.08);
            --accent: #58a6ff;
            --accent-bg: rgba(88,166,255,0.06);
            --green: #3fb950;
            --red: #f85149;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 2.2em;
            color: var(--gold);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        header p {
            color: var(--muted);
            font-size: 1.1em;
            max-width: 600px;
            margin: 0 auto;
        }
        header .biblical {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 16px;
            border: 1px solid var(--gold);
            border-radius: 20px;
            color: var(--gold);
            font-size: 0.85em;
            opacity: 0.8;
        }

        /* Mandamento card */
        .mandamento {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .mandamento:hover { border-color: #484f58; }
        .mandamento.open { border-color: var(--gold); }

        .mandamento-header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            cursor: pointer;
            user-select: none;
            gap: 14px;
            transition: background 0.2s;
        }
        .mandamento-header:hover { background: var(--gold-bg); }

        .numeral {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: var(--gold-bg);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1em;
            color: var(--gold);
            flex-shrink: 0;
        }
        .mandamento.open .numeral {
            background: var(--gold);
            color: var(--bg);
        }

        .mandamento-title {
            flex: 1;
            min-width: 0;
        }
        .mandamento-title .biblical {
            font-size: 0.88em;
            color: var(--muted);
            font-style: italic;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mandamento-title .secular {
            font-size: 1em;
            font-weight: 600;
            color: var(--text);
            display: block;
        }
        .mandamento.open .mandamento-title .secular { color: var(--gold); }

        .arrow {
            width: 28px; height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
            color: var(--muted);
            font-size: 1.2em;
            flex-shrink: 0;
        }
        .mandamento.open .arrow { transform: rotate(180deg); color: var(--gold); }

        .mandamento-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        .mandamento.open .mandamento-body {
            max-height: 99999px; /* large enough */
        }
        .mandamento-content {
            padding: 0 20px 20px 76px;
            color: var(--muted);
            font-size: 0.95em;
        }
        .btn-ver-mais {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 16px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 20px;
            font-size: 0.82em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-ver-mais:hover {
            background: var(--gold);
            color: var(--bg);
        }
        .mandamento-content .intro {
            margin-bottom: 16px;
            color: #a5acb8;
            line-height: 1.7;
        }

        /* Sub-item (level 2) */
        .subitem {
            margin-bottom: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0d1117;
            overflow: hidden;
        }
        .subitem-header {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            gap: 8px;
            transition: background 0.2s;
        }
        .subitem-header:hover { background: var(--accent-bg); }
        .subitem.open .subitem-header { background: var(--accent-bg); }
        .subitem.open { border-color: var(--accent); }

        .subitem-icon {
            font-size: 0.85em;
            color: var(--accent);
            flex-shrink: 0;
        }
        .subitem-text {
            flex: 1;
            font-size: 0.92em;
            color: #b1bac4;
            font-weight: 500;
            line-height: 1.4;
        }
        .subitem.open .subitem-text { color: var(--accent); }

        .subitem-arrow {
            font-size: 0.8em;
            color: var(--muted);
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .subitem.open .subitem-arrow { transform: rotate(180deg); color: var(--accent); }

        .subitem-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .subitem.open .subitem-body { max-height: 99999px; }
        .subitem-detail {
            padding: 0 14px 14px 34px;
            color: var(--muted);
            font-size: 0.9em;
            line-height: 1.7;
            border-top: 1px solid rgba(48,54,61,0.5);
            padding-top: 12px;
            margin-top: 0;
        }

        /* Nested sub-sub-items */
        .subsubitem {
            margin-bottom: 4px;
            border-left: 2px solid var(--border);
            padding: 6px 0 6px 12px;
        }
        .subsubitem strong {
            color: var(--green);
            display: block;
            margin-bottom: 3px;
            font-size: 0.88em;
        }
        .subsubitem p {
            color: var(--muted);
            font-size: 0.85em;
            margin: 0;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 0.85em;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .mandamento-content { padding: 0 12px 12px 50px; }
            header h1 { font-size: 1.5em; }
            .numeral { width: 34px; height: 34px; font-size: 0.95em; }
        }
    </style>
</head>
<body>
<div class="container">

    <h1>10 Mandamentos para a Política Brasileira</h1>
    <p>Um decálogo de política pública inspirado nos Dez Mandamentos bíblicos, aplicados à realidade do Brasil.</p>
    <span class="biblical">Referência ética, não religiosa</span>
</header>

<div id="mandamentos"></div>

<footer>
    Projeto Brasil &mdash; Política como arte de governar o bem comum, não o bem próprio.
</footer>

</div>

        secular: "Não concentrarás riqueza às custas da miséria",
        intro: "O Brasil não é um país pobre — é um país profundamente desigual. O 1% mais rico concentra 28% da renda nacional. Isso não é acidente, é projeto.",
        items: [
            {
                title: "Reforma tributária progressiva: fim do imposto sobre consumo, imposto sobre retirada de capital",
                detail: "Fim de ICMS, IPI, ISS, PIS/COFINS sobre cesta básica e produtos essenciais. Criado o IRC (Imposto sobre Retirada de Capital): retirada acima de 20% do lucro líquido anual de empresa com faturamento > R$ 200 mil/mês paga de 15% a 40%. Isenção total para reinvestimento e abertura de novas empresas."
            },
            {
                title: "IR sobre renda passiva acima de R$ 50 mil/mês — alíquota fixa de 27,5%",
                detail: "Aluguéis, dividendos, JCP, ganhos de capital: tudo somado. Acima de R$ 50.001/mês, todo o valor tributado a 27,5% fixo, sem progressividade. Isenção até R$ 50 mil/mês protege o pequeno investidor."
            },
            {
                title: "Tributação de dividendos + Imposto sobre Grandes Fortunas",
                detail: "Brasil é um dos únicos países que não tributam dividendos. IGF previsto no art. 153, VII, CF/88 há 38 anos: patrimônio acima de R$ 20 milhões paga 0,5% a 2% ao ano."
            },
            {
                title: "Fim do teto de gastos para saúde, educação, pesquisa e segurança",
                detail: "EC 95/2016 congelou gastos por 20 anos. SUS perdeu R$ 22 bi (2016-2022). CNPq e Capes: corte de 70%. 7.000 pesquisadores emigraram. Teto de gastos é teto de vidas."
            },
            {
                title: "Reindustrialização da cadeia alimentar + cota de retenção",
                detail: "Brasil importa 85% dos fertilizantes. Cota de 20% da produção nacional fica no mercado interno a preço de custo + 15%. Produtor que industrializa no Brasil é isento da cota."
            },
            {
                title: "Bioeconomia e política ambiental — \"Amazônia vale mais em pé\"",
                detail: "Crédito de carbono: 70% da receita para estados da Amazônia, com Renda Florestal de R$ 500/ha/ano para famílias. BioBrasil: patentes da biodiversidade. EcoTur: pousadas públicas. Conversão de garimpeiro em fiscal ou cooperativado."
            }
        ]
    }
];

function render() {
    const container = document.getElementById('mandamentos');
    container.innerHTML = mandamentos.map(m => {
        const itemsHtml = m.items.map((item, i) => {
            return `
            <div class="subitem" data-m="${m.num}-${i}">
                <div class="subitem-header" onclick="toggleSub(event, '${m.num}-${i}')">
                    <span class="subitem-icon">▸</span>
                    <span class="subitem-text">${item.title}</span>
                    <span class="subitem-arrow">▼</span>
                </div>
                <div class="subitem-body">
                    <div class="subitem-detail">${item.detail || ''}</div>
                </div>
            </div>`;
        }).join('');

        return `
        <div class="mandamento" data-m="${m.num}">
            <div class="mandamento-header" onclick="toggle(event, ${m.num})">
                <div class="numeral">${m.num}</div>
                <div class="mandamento-title">
                    <span class="biblical">"${m.biblical}"</span>
                    <span class="secular">${m.secular}</span>
                </div>
                <div class="arrow">▼</div>
            </div>
            <div class="mandamento-body">
                <div class="mandamento-content">
                    <p class="intro">${m.intro}</p>
                    ${itemsHtml}
                    <a href="mandamento.html?m=${m.num}" class="btn-ver-mais">Ver papiro completo →</a>
                </div>
            </div>
        </div>`;
    }).join('');
}

function toggle(event, num) {
    const el = document.querySelector(`.mandamento[data-m="${num}"]`);
    const wasOpen = el.classList.contains('open');

    // Close all mandamentos
    document.querySelectorAll('.mandamento').forEach(m => m.classList.remove('open'));
    // Close all subitems
    document.querySelectorAll('.subitem').forEach(s => s.classList.remove('open'));

    // If it wasn't open, open it
    if (!wasOpen) el.classList.add('open');
}

function toggleSub(event, key) {
    event.stopPropagation();
    const el = document.querySelector(`.subitem[data-m="${key}"]`);
    el.classList.toggle('open');
}

render();
</script>
</body>
</html>
